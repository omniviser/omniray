name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync workspace
        run: uv sync --all-extras --all-packages

      - name: Test omniwrap
        run: uv run --directory packages/omniwrap pytest tests/ -v --cov=omniwrap --cov-report=xml --cov-fail-under=100

      - name: Test omniray
        run: uv run --directory packages/omniray pytest tests/ -v --cov=omniray --cov-report=xml --cov-fail-under=100

  test-minimum-versions:
    name: Test minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync workspace (min versions)
        run: uv sync --all-extras --all-packages --resolution=lowest-direct

      - name: Test omniwrap
        run: uv run --directory packages/omniwrap pytest tests/ -v

      - name: Test omniray
        run: uv run --directory packages/omniray pytest tests/ -v
