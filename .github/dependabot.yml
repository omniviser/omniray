version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/packages/omniwrap"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "uv"
    directory: "/packages/omniray"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      # init/analyze must always move together — CodeQL fails with
      # "Loaded a configuration file for version X, but running version Y"
      # when the steps end up on different versions.
      codeql-action:
        patterns:
          - "github/codeql-action*"
